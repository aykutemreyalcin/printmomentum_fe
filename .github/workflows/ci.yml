name: ci

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_S3_BUCKET: printmomentum-prod-use1-053285355718
  EC2_INSTANCE_ID: i-0a6c1950651c0bc11
  GITHUB_DEPLOY_ROLE_ARN: arn:aws:iam::053285355718:role/PrintMomentum-GithubDeploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Upload SPA to S3
        run: |
          aws s3 sync dist/ "s3://${AWS_S3_BUCKET}/host/app/" --delete
          aws s3 cp dist/index.html "s3://${AWS_S3_BUCKET}/host/app/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
      - name: Reload Caddy on EC2
        run: |
          set -euo pipefail
          PARAMS=$(mktemp)
          python3 <<'PY' > "$PARAMS"
          import json
          bucket = "${{ env.AWS_S3_BUCKET }}"
          print(json.dumps({"commands": [
            "set -euo pipefail",
            "install -d -m 755 /opt/printmomentum/app",
            f"aws s3 sync s3://{bucket}/host/app/ /opt/printmomentum/app --delete",
            "cd /opt/printmomentum && docker compose --env-file .env up -d --force-recreate --no-deps caddy",
            "curl -sf -o /dev/null -w 'local_http=%{http_code}\\n' http://127.0.0.1/",
          ]}))
          PY
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name AWS-RunShellScript \
            --parameters "file://$PARAMS" \
            --query Command.CommandId --output text)
          rm -f "$PARAMS"
          for _ in $(seq 1 24); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query Status --output text)
            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --query StandardOutputContent --output text
              exit 0
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$CMD_ID" \
                --instance-id "${{ env.EC2_INSTANCE_ID }}" \
                --output json
              exit 1
            fi
            sleep 5
          done
          echo "SSM command timed out waiting for completion"
          exit 1
      - name: Verify public app
        run: curl -sf -o /dev/null "https://app.printmomentum.com/"
